<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1035" viewBox="0 0 1200 1035" role="img" aria-labelledby="title desc"><title id="title">Reuse through a defined lifecycle</title><desc id="desc">The lifecycle moves from prewarm to available, acquire, active, pending release, and return. Capacity and reset policy differ between generic pools and the separate ID-based manager.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7150A0"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#242031}.title{font-size:32px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:21px}.note{font-size:20px;fill:#51465F}.box{fill:#FFFCFF;stroke:#B49BCF;stroke-width:2}.edge{fill:none;stroke:#7150A0;stroke-width:3}.scope{fill:#EEE5F8;stroke:#B49BCF;stroke-width:2;stroke-dasharray:8 6}</style><rect width="1200" height="1035" rx="24" fill="#F6F1FC"/><text x="40" y="57" class="title">Reuse through a defined lifecycle</text><text x="40" y="94" class="note">ObjectPool stores reusable nodes; the caller configures their gameplay behaviour.</text><rect x="40" y="135" width="320" height="140" rx="18" class="box"/><text x="64" y="173" class="label">1 / Prewarm</text><text x="64" y="211" class="body">Instantiate configured scenes</text><text x="64" y="240" class="body">Park under the pool node</text><rect x="440" y="135" width="320" height="140" rx="18" class="box"/><text x="464" y="173" class="label">2 / Available</text><text x="464" y="211" class="body">Hidden; processing disabled</text><text x="464" y="240" class="body">Stored in an available array</text><rect x="840" y="135" width="320" height="140" rx="18" class="box"/><text x="864" y="173" class="label">3 / Acquire</text><text x="864" y="211" class="body">Pop a valid available node</text><text x="864" y="240" class="body">Or grow if policy permits</text><path d="M360 205 H430" class="edge" marker-end="url(#arrow)"/><path d="M760 205 H830" class="edge" marker-end="url(#arrow)"/><path d="M1000 275 V400" class="edge" marker-end="url(#arrow)"/><rect x="840" y="410" width="320" height="160" rx="18" class="box"/><text x="864" y="448" class="label">4 / Active</text><text x="864" y="486" class="body">Move to active parent</text><text x="864" y="515" class="body">Show and enable processing</text><text x="864" y="544" class="body">Caller configures and plays</text><rect x="440" y="410" width="320" height="160" rx="18" class="box"/><text x="464" y="448" class="label">5 / Pending release</text><text x="464" y="486" class="body">Queue deferred return</text><text x="464" y="515" class="body">Ignore duplicate requests</text><text x="464" y="544" class="body">Do not reuse this slot yet</text><rect x="40" y="410" width="320" height="160" rx="18" class="box"/><text x="64" y="448" class="label">6 / Return</text><text x="64" y="486" class="body">Remove from active registry</text><text x="64" y="515" class="body">Park back under the pool</text><text x="64" y="544" class="body">Hide and disable processing</text><path d="M840 490 H770" class="edge" marker-end="url(#arrow)"/><path d="M440 490 H370" class="edge" marker-end="url(#arrow)"/><path d="M200 410 V340 H600 V285" class="edge" marker-end="url(#arrow)"/><text x="41" y="335" class="note">Available for reuse</text><rect x="40" y="635" width="1120" height="160" rx="18" class="box"/><text x="64" y="673" class="label">Capacity belongs to each use case</text><text x="64" y="711" class="body">Damage / telegraph / impact pools allow growth without a hard cap in the reviewed setup.</text><text x="64" y="740" class="body">Grass debris prewarms 32 emitters, disables growth, and skips a burst when all slots are busy.</text><text x="64" y="769" class="body">Player projectile pools use their own configured limits and scene-matching lookup.</text><rect x="40" y="835" width="1120" height="160" rx="18" class="box"/><text x="64" y="873" class="label">Reset is a separate lifecycle boundary</text><text x="64" y="911" class="body">ObjectPool.release_all() synchronously reclaims active nodes, including pending returns.</text><text x="64" y="940" class="body">Runtime feedback spawners call it on runtime_reset. Call order matters before level disposal.</text><text x="64" y="969" class="body">The ID-based PoolManager instead clears its factory objects on transition_requested.</text></svg>