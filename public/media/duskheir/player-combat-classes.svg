<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" role="img" aria-labelledby="title desc"><title id="title">Combat classes and data resources</title><desc id="desc">The action state machine owns an active attack state. BasicAttackState extends PlayerAttackState, selects a catalog combo, and reads its ordered step resources.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7150A0"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#242031}.title{font-size:32px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:21px}.note{font-size:20px;fill:#51465F}.box{fill:#FFFCFF;stroke:#B49BCF;stroke-width:2}.muted{fill:#EEE5F8;stroke:#7150A0;stroke-width:2;stroke-dasharray:7 6}.edge{fill:none;stroke:#7150A0;stroke-width:3}.dashed{stroke-dasharray:8 6}</style><rect width="1200" height="1010" rx="24" fill="#F6F1FC"/><text x="40" y="60" class="title">Combat classes and data resources</text><text x="40" y="96" class="note">Focused relationships in the current combat path; presentation is a separate layer.</text><rect x="40" y="140" width="460" height="150" rx="18" class="box"/><text x="64" y="179" class="label">PlayerActionStateMachine</text><text x="64" y="216" class="body">Owns current_state</text><text x="64" y="245" class="body">Changes state by PlayerStateEnum</text><text x="64" y="274" class="body">Calls enter / exit / process</text><rect x="700" y="140" width="460" height="150" rx="18" class="box"/><text x="724" y="179" class="label">PlayerAttackState</text><text x="724" y="216" class="body">chain_window_opened</text><text x="724" y="245" class="body">cancel_window_opened</text><text x="724" y="274" class="body">dash_window_opened</text><path d="M500 210 H690" class="edge" marker-end="url(#arrow)"/><text x="520" y="190" class="note">active state</text><rect x="700" y="420" width="460" height="160" rx="18" class="box"/><text x="724" y="459" class="label">PlayerBasicAttackState</text><text x="724" y="496" class="body">current_combo_step_index</text><text x="724" y="525" class="body">Reads step animation + projectiles</text><text x="724" y="554" class="body">Selects / advances / switches combo</text><path d="M930 420 V300" class="edge" marker-end="url(#arrow)"/><text x="947" y="360" class="note">extends</text><rect x="40" y="420" width="460" height="160" rx="18" class="box"/><text x="64" y="459" class="label">PlayerBasicComboCatalog</text><text x="64" y="496" class="body">sun_basic_combo</text><text x="64" y="525" class="body">moon_basic_combo</text><text x="64" y="554" class="body">dusk_basic_combo</text><path d="M700 500 H510" class="edge" marker-end="url(#arrow)"/><text x="539" y="480" class="note">selects</text><rect x="40" y="720" width="460" height="160" rx="18" class="box"/><text x="64" y="759" class="label">BasicAttackComboDefinition</text><text x="64" y="796" class="body">steps: ordered resource array</text><text x="64" y="825" class="body">get_step(index)</text><text x="64" y="854" class="body">get_next_step_index(index)</text><path d="M270 580 V710" class="edge" marker-end="url(#arrow)"/><text x="290" y="650" class="note">references</text><rect x="700" y="720" width="460" height="160" rx="18" class="box"/><text x="724" y="759" class="label">BasicAttackStepDefinition</text><text x="724" y="796" class="body">animation_key + hit data</text><text x="724" y="825" class="body">projectile_scene_ref + amount</text><text x="724" y="854" class="body">Timing / cancel / motion fields</text><path d="M500 800 H690" class="edge" marker-end="url(#arrow)"/><text x="515" y="780" class="note">contains 1..n</text><path d="M930 580 V710" class="edge" marker-end="url(#arrow)"/><text x="947" y="650" class="note">reads</text><text x="40" y="940" class="note">Resource fields describe the authoring surface. The active consumer determines which fields run.</text><text x="40" y="973" class="note">Current chain, movement-cancel, and dash gates are opened by animation events.</text></svg>