<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="865" viewBox="0 0 1200 865" role="img" aria-labelledby="title desc"><title id="title">From input to a permitted action</title><desc id="desc">Solid arrows show the active path from remappable controls to animation. Dashed arrows show timestamped storage; active attacks currently use frame flags.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7150A0"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#242031}.title{font-size:32px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:21px}.note{font-size:20px;fill:#51465F}.box{fill:#FFFCFF;stroke:#B49BCF;stroke-width:2}.muted{fill:#EEE5F8;stroke:#7150A0;stroke-width:2;stroke-dasharray:7 6}.edge{fill:none;stroke:#7150A0;stroke-width:3}.dashed{stroke-dasharray:8 6}</style><rect width="1200" height="865" rx="24" fill="#F6F1FC"/><text x="40" y="60" class="title">From input to a permitted action</text><text x="40" y="96" class="note">Active execution path and the separate temporal-buffer API</text><rect x="40" y="140" width="320" height="140" rx="18" class="box"/><text x="64" y="179" class="label">1 / InputMap</text><text x="64" y="216" class="body">Remappable actions</text><text x="64" y="245" class="body">Keyboard / mouse / pad</text><rect x="440" y="140" width="320" height="140" rx="18" class="box"/><text x="464" y="179" class="label">2 / PlayerInputRouter</text><text x="464" y="216" class="body">Samples each physics tick</text><text x="464" y="245" class="body">Respects UI input capture</text><rect x="840" y="140" width="320" height="140" rx="18" class="box"/><text x="864" y="179" class="label">3 / Command snapshot</text><text x="864" y="216" class="body">Movement + attack intent</text><text x="864" y="245" class="body">One-frame pressed flags</text><path d="M360 210 H430" class="edge" marker-end="url(#arrow)"/><path d="M760 210 H830" class="edge" marker-end="url(#arrow)"/><path d="M1000 280 V390" class="edge" marker-end="url(#arrow)"/><rect x="840" y="400" width="320" height="140" rx="18" class="box"/><text x="864" y="439" class="label">4 / Active action state</text><text x="864" y="476" class="body">Accepts current-frame input</text><text x="864" y="505" class="body">Gates chain / move / dash</text><rect x="440" y="400" width="320" height="140" rx="18" class="box"/><text x="464" y="439" class="label">5 / Combo + step data</text><text x="464" y="476" class="body">Selects Sun / Moon / Dusk</text><text x="464" y="505" class="body">Animation key + projectiles</text><rect x="40" y="400" width="320" height="140" rx="18" class="box"/><text x="64" y="439" class="label">6 / Animation playback</text><text x="64" y="476" class="body">Requests the selected attack</text><text x="64" y="505" class="body">Events open action windows</text><path d="M840 470 H770" class="edge" marker-end="url(#arrow)"/><path d="M440 470 H370" class="edge" marker-end="url(#arrow)"/><path d="M200 540 V590 H1000 V550" class="edge" marker-end="url(#arrow)"/><text x="290" y="580" class="note">Animation events feed back into the active attack state</text><rect x="40" y="670" width="1120" height="155" rx="18" class="muted"/><text x="64" y="709" class="label">Timestamped input storage — a separate responsibility</text><text x="64" y="746" class="body">The router also records presses with timestamps; the API supports expiry, consumption, and reset.</text><text x="64" y="775" class="body">The active attack states shown above read frame flags, not the temporal peek / consume API.</text><path d="M600 280 V325 H1180 V748 H1170" class="edge dashed" marker-end="url(#arrow)"/></svg>