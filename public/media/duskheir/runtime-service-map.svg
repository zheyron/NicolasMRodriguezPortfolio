<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc"><title id="title">One runtime, explicit system connections</title><desc id="desc">GameplayRuntime persists outside level scenes and owns shared input, combat, feedback and ID-pool services. Player projectile pools and the audio adapter have separate owners.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7150A0"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#242031}.title{font-size:32px;font-weight:700}.label{font-size:23px;font-weight:700}.body{font-size:21px}.note{font-size:20px;fill:#51465F}.box{fill:#FFFCFF;stroke:#B49BCF;stroke-width:2}.edge{fill:none;stroke:#7150A0;stroke-width:3}.scope{fill:#EEE5F8;stroke:#B49BCF;stroke-width:2;stroke-dasharray:8 6}</style><rect width="1200" height="1140" rx="24" fill="#F6F1FC"/><text x="40" y="57" class="title">One runtime, explicit system connections</text><text x="40" y="94" class="note">Selected ownership and dependency relationships from the current scene wiring.</text><rect x="40" y="125" width="1120" height="105" rx="18" class="box"/><text x="64" y="163" class="label">Level-owned consumers: player, enemies, UI</text><text x="64" y="201" class="body">Resolve shared services through typed getters; register the active player.</text><path d="M600 230 V280" class="edge" marker-end="url(#arrow)"/><rect x="40" y="290" width="1120" height="610" rx="24" class="scope"/><text x="65" y="334" class="label">GameplayRuntime · persistent Autoload host</text><text x="65" y="369" class="body">Serialized child references; startup fallback lookup; typed service access.</text><rect x="65" y="400" width="510" height="180" rx="18" class="box"/><text x="89" y="438" class="label">Input context</text><text x="89" y="476" class="body">InputDeviceService → glyph resolution</text><text x="89" y="505" class="body">Device changes → cursor visibility</text><text x="89" y="534" class="body">Haptics share the same device source</text><rect x="625" y="400" width="510" height="180" rx="18" class="box"/><text x="649" y="438" class="label">Combat context</text><text x="649" y="476" class="body">Combat registry → CameraDirector3D</text><text x="649" y="505" class="body">Player registration → active camera target</text><text x="649" y="534" class="body">Combat-state signal → music adapter¹</text><rect x="65" y="615" width="510" height="180" rx="18" class="box"/><text x="89" y="653" class="label">Pooled feedback</text><text x="89" y="691" class="body">Grass manager → debris spawner</text><text x="89" y="720" class="body">Damage numbers / telegraphs / impacts</text><text x="89" y="749" class="body">Each spawner owns ObjectPool instance(s)</text><rect x="625" y="615" width="510" height="180" rx="18" class="box"/><text x="649" y="653" class="label">ID-based object registry</text><text x="649" y="691" class="body">PoolManager → BaseFactory</text><text x="649" y="720" class="body">Factory owns its object container</text><text x="649" y="749" class="body">Enemy services request objects by ID</text><text x="65" y="845" class="body">Other hosted services: hitstop, dodge threats, level transitions, checkpoints.</text><rect x="40" y="940" width="535" height="160" rx="18" class="box"/><text x="64" y="978" class="label">Outside this host: player pools</text><text x="64" y="1016" class="body">PlayerProjectileSpawner creates its own</text><text x="64" y="1045" class="body">ObjectPool children for projectile scenes.</text><text x="64" y="1074" class="body">It does not use the ID-based PoolManager.</text><rect x="625" y="940" width="535" height="160" rx="18" class="box"/><text x="649" y="978" class="label">Outside this host: audio &amp; lifecycle</text><text x="649" y="1016" class="body">¹ CombatMusicDirector lives under audio.</text><text x="649" y="1045" class="body">SceneManager publishes load events.</text><text x="649" y="1074" class="body">GlobalState publishes runtime_reset.</text></svg>